name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint and types
        run: |
          ruff check .
          mypy
      - name: Tests
        run: pytest -q
      - name: Scenario evaluation
        run: triagewright eval
      - name: Wheel installs into a clean environment
        run: |
          pip install build
          python -m build --outdir /tmp/dist .
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install /tmp/dist/*.whl
          cd /tmp && /tmp/clean/bin/triagewright eval
